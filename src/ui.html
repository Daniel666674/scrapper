<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photo Grabber</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--ink:#1d1b19;--mute:#6f6a63;--line:#e6e1da;--accent:#1d1b19}
@media(prefers-color-scheme:dark){:root{--bg:#161513;--card:#201e1c;--ink:#f1ede7;--mute:#a49e95;--line:#34312d;--accent:#f1ede7}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:32px 16px}
h1{font-size:28px;margin:0 0 4px}p.sub{color:var(--mute);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;padding:12px;font:14px ui-monospace,monospace;background:transparent;color:inherit;resize:vertical}
label.opt{display:flex;gap:8px;align-items:center;margin:12px 0 0;color:var(--mute);font-size:14px}
button{margin-top:16px;width:100%;padding:14px;border:0;border-radius:10px;background:var(--accent);color:var(--bg);font-size:17px;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
#log{margin-top:20px;white-space:pre-wrap;font:13px/1.6 ui-monospace,monospace;color:var(--mute);max-height:300px;overflow:auto}
#result{margin-top:16px;display:none}
a.dl{display:block;text-align:center;padding:14px;border-radius:10px;background:#1f8f4e;color:#fff;font-weight:600;text-decoration:none}
small{display:block;margin-top:8px;color:var(--mute);text-align:center}
.warn{display:none;margin-top:8px;color:#b45309;font-size:13px}
</style></head><body><main>
<h1>📸 Photo Grabber</h1>
<p class="sub">Paste your supplier's product links (one per line), click the button, get a ZIP with all the photos.</p>
<div class="card">
  <textarea id="urls" placeholder="https://supplier.com/products/perfume-one&#10;https://supplier.com/products/perfume-two" autofocus></textarea>
  <label class="opt"><input type="checkbox" id="all"> Also grab secondary images (may include extras)</label>
  <label class="opt"><input type="checkbox" id="norobots"> Skip the site's robots.txt (only with your supplier's permission)</label>
  <div class="warn" id="warn">Only do this if your supplier explicitly allowed it.</div>
  <button id="go">Download photos</button>
  <div id="log"></div>
  <div id="result"><a class="dl" id="zip" href="#">⬇ Download ZIP</a><small id="saved"></small></div>
</div></main>
<script>
const $=id=>document.getElementById(id);
$("norobots").onchange=e=>$("warn").style.display=e.target.checked?"block":"none";
$("go").onclick=async()=>{
  $("go").disabled=true;$("go").textContent="Working…";$("result").style.display="none";$("log").textContent="";
  const r=await fetch("/api/start",{method:"POST",body:JSON.stringify({urls:$("urls").value.split(/\s+/),all:$("all").checked,respectRobots:!$("norobots").checked})});
  const j=await r.json();
  if(!r.ok){$("log").textContent="⚠️ "+j.error;reset();return}
  const t=setInterval(async()=>{
    const s=await (await fetch("/api/job/"+j.id)).json();
    $("log").textContent=s.log.join("\n");$("log").scrollTop=1e9;
    if(s.done){clearInterval(t);reset();
      if(s.zip){$("zip").href="/api/job/"+j.id+"/zip";$("saved").textContent="Also saved on your computer in: "+s.saved;$("result").style.display="block"}}
  },800);
};
function reset(){$("go").disabled=false;$("go").textContent="Download photos"}
</script></body></html>
